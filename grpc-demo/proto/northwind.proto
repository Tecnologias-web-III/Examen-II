syntax = "proto3";

		package northwind;

		// ---------- Mensajes (estructura de los datos) ----------

		message Category {
		  int32 CategoryID = 1;
		  string CategoryName = 2;
		  string Description = 3;
		}

		message Product {
		  int32 ProductID = 1;
		  string ProductName = 2;
		  int32 SupplierID = 3;
		  int32 CategoryID = 4;
		  string QuantityPerUnit = 5;
		  double UnitPrice = 6;
		  int32 UnitsInStock = 7;
		  int32 ReorderLevel = 8;
		}

		message Empty {}

		message CategoryList {
		  repeated Category categories = 1;
		}

		message ProductList {
		  repeated Product products = 1;
		}

		// b) campos especificos
		message FieldsRequest {
		  repeated string fields = 1;
		}

		message Record {
		  map<string, string> values = 1;
		}

		message RecordList {
		  repeated Record records = 1;
		}

		// c) filtros
		message FilterRequest {
		  string field = 1;   // CategoryID, ProductName o UnitPrice_min
		  string value = 2;
		}

		// e) eliminar
		message IdRequest {
		  int32 id = 1;
		}

		message Reply {
		  bool success = 1;
		  string message = 2;
		}

		// d) JOIN + agregacion
		message SalesSummary {
		  string customerId = 1;
		  string customerName = 2;
		  int32 orderCount = 3;
		  double totalSales = 4;
		}

		message SalesSummaryList {
		  repeated SalesSummary summaries = 1;
		}

		// f) paginacion y ordenamiento
		message PageRequest {
		  int32 page = 1;
		  int32 pageSize = 2;
		  string sortBy = 3;
		  string sortOrder = 4;
		}
		message ProductPage {
		  repeated Product products = 1;
		  int32 page = 2;
		  int32 pageSize = 3;
		  int32 total = 4;
		}

		// g) JWT
		message LoginRequest {
		  string username = 1;
		  string password = 2;
		}

		message AuthResponse {
		  bool success = 1;
		  string token = 2;
		  string message = 3;
		}

		// ---------- Servicio (operaciones disponibles) ----------

		service ProductService {
		  rpc GetAllCategories (Empty) returns (CategoryList);
		  rpc GetAllProducts (Empty) returns (ProductList);          // a
		  rpc GetProductFields (FieldsRequest) returns (RecordList); // b
		  rpc FilterProducts (FilterRequest) returns (ProductList);  // c
		  rpc AddProduct (Product) returns (Product);                // e (insertar)
		  rpc UpdateProduct (Product) returns (Reply);               // e (modificar)
		  rpc DeleteProduct (IdRequest) returns (Reply);             // e (eliminar)
		  rpc GetSalesByCustomer (Empty) returns (SalesSummaryList);  // d
		  rpc GetProductsPage (PageRequest) returns (ProductPage);   // f
		  rpc Login (LoginRequest) returns (AuthResponse);           // g
		}
